name: Deploy workbench to Cloudflare

# Same pattern as PreferredAI.github.io: build the static site in one job, then
# deploy the uploaded build with Wrangler (as in its deploy-admin.yml) to the
# cornac-workbench Worker, which serves web/dist as static assets (web/wrangler.jsonc).

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      site_ref:
        description: Branch, tag, or commit to deploy
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: production-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      site_sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Check out revision
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.site_ref || github.sha }}
          persist-credentials: false

      - name: Record source revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build static site
        working-directory: web
        run: npm run build

      - name: Upload static build and Worker config
        uses: actions/upload-artifact@v7
        with:
          name: static-build
          path: |
            web/dist
            web/wrangler.jsonc
          if-no-files-found: error
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: workbench-production
      url: https://cornac-workbench.preferred.ai
    steps:
      - name: Download static build and Worker config
        uses: actions/download-artifact@v8
        with:
          name: static-build
          path: site

      - name: Check static asset limits
        shell: bash
        run: |
          set -euo pipefail
          test -f site/wrangler.jsonc
          test ! -e site/dist/_worker.js
          test -z "$(find site/dist -type l -print -quit)"
          file_count="$(find site/dist -type f | wc -l | tr -d ' ')"
          echo "Files: $file_count"
          test "$file_count" -le 20000
          while IFS= read -r file; do
            size="$(stat -c '%s' "$file")"
            test "$size" -le 26214400
          done < <(find site/dist -type f)

      - name: Skip a superseded automatic deployment
        if: github.event_name == 'push'
        id: freshness
        env:
          EXPECTED_SHA: ${{ needs.build.outputs.site_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [[ "$current_sha" == "$EXPECTED_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping superseded revision $EXPECTED_SHA; main is $current_sha." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy to Cloudflare Workers
        if: github.event_name == 'workflow_dispatch' || steps.freshness.outputs.current == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          packageManager: npm
          wranglerVersion: 4.124.0
          command: deploy --config wrangler.jsonc --message "${{ needs.build.outputs.site_sha }}"

      - name: Smoke-test production
        if: github.event_name == 'workflow_dispatch' || steps.freshness.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          site=https://cornac-workbench.preferred.ai
          index_file="$RUNNER_TEMP/index.html"
          curl --fail --silent --show-error --location --retry 10 --retry-all-errors "$site/" > "$index_file"
          script="$(grep -o '/assets/[^" ]*\.js' "$index_file" | sed -n '1p')"
          test -n "$script"
          curl --fail --silent --show-error --location "$site$script" > /dev/null
          curl --fail --silent --show-error --location "$site/journeys/manifest.json" \
            | python3 -c 'import json, sys; m = json.load(sys.stdin); assert len(m["pairs"]) == 8, len(m["pairs"])'

      - name: Record deployment provenance
        if: github.event_name == 'workflow_dispatch' || steps.freshness.outputs.current == 'true'
        env:
          SITE_SHA: ${{ needs.build.outputs.site_sha }}
        run: |
          {
            echo "### Cornac Workbench production deployment"
            echo "- Source: \`$SITE_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
